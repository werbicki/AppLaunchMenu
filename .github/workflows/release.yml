name: .NET CI & Release

on:
  push:
    # Trigger only when version tags are pushed (e.g., v1.0.0, v2.1.3)
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    
    # Grants the workflow permission to write and publish releases
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish Application
      run: dotnet publish --configuration Release --output ./publish

    # Zip the publish directory so it's a single file download for users
    - name: Zip Release Asset
      run: zip -r AppLuanchMenu.zip ./publish

    # Automatically creates a GitHub Release and uploads the zip file
    - name: Create Public Release
      uses: softprops/action-gh-release@v2
      with:
        files: AppLuanchMenu.zip
        generate_release_notes: true  # Automatically populates release notes from commit history
